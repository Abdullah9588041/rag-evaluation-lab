name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install numpy scipy pandas matplotlib scikit-learn rank-bm25 pytest
      - name: Run unit tests (no model downloads)
        run: |
          PYTHONPATH=src python -m pytest tests/test_chunking.py tests/test_evaluation.py tests/test_determinism.py -q
