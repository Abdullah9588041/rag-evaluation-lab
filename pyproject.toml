[project]
name = "rag-evaluation-lab"
version = "0.1.0"
description = "RAG retrieval bake-off: chunking x retrieval x rerank with statistical evaluation"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
